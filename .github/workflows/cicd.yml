name: CICD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      nowUsername: ${{ secrets.SN_USERNAME }}
      nowPassword: ${{ secrets.SN_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve ServiceNow instance
        env:
          RAW: ${{ vars.SN_INSTANCE_DOMAIN }}
        run: |
          if [ -z "$RAW" ]; then
            echo "::error::SN_INSTANCE_DOMAIN is not set."
            exit 1
          fi

          INSTANCE=$(printf '%s' "$RAW" \
            | tr -d '[:space:]' \
            | tr '[:upper:]' '[:lower:]' \
            | sed -e 's#^[a-z][a-z0-9+.-]*://##' \
                  -e 's#^//##' \
                  -e 's#/.*$##' \
                  -e 's#^[^a-z0-9]*##' \
                  -e 's#[^a-z0-9]*$##' \
                  -e 's#\.service-now\.com$##')

          echo "Resolved ServiceNow instance: $INSTANCE"
          echo "SN_INSTANCE=$INSTANCE" >> "$GITHUB_ENV"
               
      - name: Apply changes
        uses: ServiceNow/sncicd-apply-changes@master
        continue-on-error: true
        env:
          nowSourceInstance: ${{ vars.SN_INSTANCE_DOMAIN }}
          nowUsername: ${{ secrets.SN_USERNAME }}
          nowPassword: ${{ secrets.SN_PASSWORD }}
          appScope: x_cd_grc_app
