name: CICD Pipeline

on:
  push:
    branches:
      - lab2-start

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve ServiceNow instance
        env:
          RAW: ${{ vars.SN_INSTANCE_DOMAIN }}
        run: |
          if [ -z "$RAW" ]; then
            echo "::error::SN_INSTANCE_DOMAIN is not set."
            echo "::error::Go to Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

          INSTANCE=$(printf '%s' "$RAW" \
            | tr -d '[:space:]' \
            | tr '[:upper:]' '[:lower:]' \
            | sed -e 's#^[a-z][a-z0-9+.-]*://##' \
                   -e 's#^//##' \
                   -e 's#/.*$##' \
                   -e 's#^[^a-z0-9]*##' \
                   -e 's#[^a-z0-9]*$##' \
                   -e 's#\.service-now\.com$##')

          if [ -z "$INSTANCE" ]; then
            echo "::error::Could not resolve ServiceNow instance"
            exit 1
          fi

          echo "Resolved ServiceNow instance: $INSTANCE"
          echo "SN_INSTANCE=$INSTANCE" >> $GITHUB_ENV

      - name: Debug configuration
        run: |
          echo "SN_INSTANCE=$SN_INSTANCE"
          echo "SN_USERNAME configured: ${{ secrets.SN_USERNAME != '' }}"
          echo "SN_PASSWORD configured: ${{ secrets.SN_PASSWORD != '' }}"

      - name: Apply changes
        uses: ServiceNow/sncicd-apply-changes@2.0.0
        env:
          nowUsername: ${{ secrets.SN_USERNAME }}
          nowPassword: ${{ secrets.SN_PASSWORD }}
          nowSourceInstance: ${{ env.SN_INSTANCE }}
          appScope: x_cd_grc_app
